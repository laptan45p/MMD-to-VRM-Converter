name: Windows tool release
on:
  push:
    branches: ['release/v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - name: Package and validate source tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $version = ($env:GITHUB_REF_NAME -replace '^release/v','')
          $zip = "artifacts/MMD-to-VRM-Converter-v$version-Windows.zip"
          git archive --format=zip --prefix=MMD-to-VRM-Converter/ -o $zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create archive' }
          python -m zipfile -t $zip
          if ($LASTEXITCODE -ne 0) { throw 'Invalid ZIP' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\r?\n(.*?)(?=^## |\z)'
          $match = [regex]::Match($changelog,$pattern)
          if (-not $match.Success) { throw 'Version missing from CHANGELOG.md' }
          $notes = $match.Groups[1].Value.Trim() + "`n`n## 使い方`n`nWindows.zipを展開し、start.batから起動してください。BlenderとMMD Toolsは別途必要です。モデル・テクスチャは同梱していません。既存環境はツールのファイル一式を更新してください。"
          $notes | Set-Content artifacts/notes.md -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = ($env:GITHUB_REF_NAME -replace '^release/v','')
          gh release create "v$version" --target $env:GITHUB_SHA --draft --title "MMD to VRM Converter $version" --notes-file artifacts/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          $assets = @((Get-ChildItem artifacts/*.zip).FullName) + @((Resolve-Path artifacts/SHA256SUMS.txt).Path)
          gh release upload "v$version" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload assets; remains draft' }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
